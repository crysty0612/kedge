[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kedge"
version = "1.0.2"
description = "Autonomous GitOps & Resilient State Fabric Engine for Containers and Host State"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kedge Contributors"}
]
keywords = ["gitops", "backup", "disaster-recovery", "sqlite", "docker", "komodo", "homelab"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
kedge = "kedge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kedge*"]
